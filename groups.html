<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apocalypsis - Группировки</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/groups-redesign.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body id="page-groups">
    <!-- The main site navigation and header are part of the index.html shell -->
    <main id="main-content">
        <h1 class="groups-main-title">Группировки</h1>
        <div class="groups-grid">
            <!-- Group cards will be dynamically generated by JavaScript -->
        </div>

        <!-- Modal Structure -->
        <div id="group-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-background-decorative"></div>
                <button class="modal-close-btn" aria-label="Закрыть"><span class="material-symbols-outlined">close</span></button>
                <div class="modal-body">
                    <div class="modal-image-container">
                        <img id="modal-group-image" src="" alt="Group Image">
                    </div>
                    <div class="modal-text-content">
                        <h2 id="modal-group-name"></h2>
                        <span id="modal-group-type"></span>
                        <p id="modal-group-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
