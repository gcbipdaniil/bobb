<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - Apocalypsis</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        .not-found-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
        }
        .not-found-title {
            font-size: 5rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        .not-found-subtitle {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 30px;
        }
        .not-found-text {
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header>
            <a href="/" aria-label="Вернуться на главную">
                <div class="logo"><img src="/assets/images/logo.png" alt="Apocalypsis Logo"></div>
            </a>
        </header>
        <main id="main-content">
            <div class="not-found-container">
                <h1 class="not-found-title">404</h1>
                <h2 class="not-found-subtitle">Страница не найдена</h2>
                <p class="not-found-text">
                    Возможно, вы ошиблись в адресе или страница была перемещена. Давайте вернемся на главную и попробуем снова.
                </p>
                <a href="/" class="btn">Вернуться на главную</a>
            </div>
        </main>
    </div>
</body>
</html>
